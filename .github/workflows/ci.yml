# SPDX-License-Identifier: GPL-3.0-or-later
# Cloud CI (D202). Runs the Node-only part of `npm run ci` on a GitHub-hosted Windows runner. Steps that need laptop-only
# inputs (libobs host, GPU, .venv, legacy/, private profile) are reported NOT RUN by tools/ci.mjs and never stamp a push.
name: ci

# Manual only for now: the cloud `test` step still fails on tests that need legacy/ (tests/registry.test.mjs and
# possibly others, docs/evidence/2026-11-03-github-actions-ci.md). Switch to push/pull_request once a manual run passes.
# workflow_dispatch works only once the file is on the default branch (master); until then a push to the probe
# branch `ci/cloud-probe` runs it.
on:
  workflow_dispatch:
  push:
    branches: ['ci/cloud-probe']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The non-test cloud steps. The `test` step is left out here and runs per file in the `test` matrix below, because
  # the whole suite hung on the runner (runs 41736001699 and 41793694256 hit the 30 and 60 min job limits).
  ci:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      UJWALAM_CI_ENV: cloud
      UJWALAM_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The laptop runs 26.x. A 22.x run (2026-11-03, run 41731910764) failed 75 tests and cancelled 45 more, mostly
          # in the event-core audit/SQLite and data-dir ACL tests; the engines floor (>=22.13) stays UNVERIFIED.
          node-version: '26.x'
      - run: npm ci
      - run: node tools/ci.mjs --only lint,validate-outputs,validate-games,stray-mocks

  # The same files `npm test` runs (tests/*.test.mjs, tests/outputs/*.test.mjs), as a list for the matrix.
  list:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        shell: pwsh
        run: |
          $f = @(Get-ChildItem tests/*.test.mjs, tests/outputs/*.test.mjs | ForEach-Object { (Resolve-Path -Relative $_.FullName).Replace('\', '/').TrimStart('./') })
          "files=$(ConvertTo-Json -Compress -InputObject $f)" >> $env:GITHUB_OUTPUT

  # One job per test file, so a hang is cut at 5 min and named. Each test's name is printed when it starts
  # (tools/test-start-reporter.mjs) and again with its result (spec reporter).
  test:
    needs: list
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.list.outputs.files) }}
    env:
      UJWALAM_CI_ENV: cloud
      UJWALAM_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
      - run: npm ci
      - run: node --test --test-timeout=240000 --test-reporter=./tools/test-start-reporter.mjs --test-reporter-destination=stdout --test-reporter=spec --test-reporter-destination=stdout "${{ matrix.file }}"
