# SPDX-License-Identifier: GPL-2.0-or-later
# Cloud CI (D202). Runs the Node-only part of `npm run ci` on a GitHub-hosted Windows runner. Steps that need laptop-only
# inputs (libobs host, GPU, .venv, legacy/, private profile) are reported NOT RUN by tools/ci.mjs and never stamp a push.
name: ci

# Manual only for now: the cloud `test` step still fails on tests that need legacy/ (tests/registry.test.mjs and
# possibly others, docs/evidence/2026-11-03-github-actions-ci.md). Switch to push/pull_request once a manual run passes.
# workflow_dispatch works only once the file is on the default branch (master); until then a push to the probe
# branch `ci/cloud-probe` runs it.
on:
  workflow_dispatch:
  push:
    branches: ['ci/cloud-probe']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 60 # the 26.x probe (run 41736001699) was still in `test` at 30 min
    env:
      UJWALAM_CI_ENV: cloud
      UJWALAM_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The laptop runs 26.x. A 22.x run (2026-11-03, run 41731910764) failed 75 tests and cancelled 45 more, mostly
          # in the event-core audit/SQLite and data-dir ACL tests; the engines floor (>=22.13) stays UNVERIFIED.
          node-version: '26.x'
      - run: npm ci
      - run: npm run ci
